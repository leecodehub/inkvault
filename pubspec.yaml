name: inkvault2
description: "InkVault - a manhwa reader powered by the MangaDex API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/images/

# Generate launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/inkvault_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#F0F2F5"
  adaptive_icon_foreground: "assets/icon/inkvault_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/inkvault_icon.png"
    background_color: "#F0F2F5"
    theme_color: "#E11D48"
  windows:
    generate: false
  macos:
    generate: false
